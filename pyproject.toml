[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fetchjack"
version = "0.1.0"
description = "Container-only educational Server-Side Request Forgery (SSRF) demonstration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fetchjack"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_decorators = false
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
