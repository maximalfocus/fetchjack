name: fetchjack

services:
  # Allowlisted upstream fixture — the one external content source the preview
  # feature is meant to use. Reachable only inside the container network.
  assets:
    build: .
    image: fetchjack:dev
    command: ["uvicorn", "fetchjack.fixtures.app:app", "--host", "0.0.0.0", "--port", "80"]
    environment:
      FIXTURE_ROLE: assets
    networks:
      larkspur:
        aliases:
          - assets.larkspur.test
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:80/healthz').status_code==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Internal-only fixture — never on the allowlist and never published to the
  # host. Serves a conspicuously fictional internal service credential.
  backoffice:
    build: .
    image: fetchjack:dev
    command: ["uvicorn", "fetchjack.fixtures.app:app", "--host", "0.0.0.0", "--port", "80"]
    environment:
      FIXTURE_ROLE: internal
    networks:
      larkspur:
        aliases:
          - backoffice.larkspur.internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:80/healthz').status_code==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # The secure application: the default long-running service. Enforces the
  # scheme + host allowlist on every request, including each redirect hop.
  secure:
    build: .
    image: fetchjack:dev
    command: ["uvicorn", "fetchjack.apps.secure:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ALLOWED_SCHEMES: http,https
      ALLOWED_HOSTS: assets.larkspur.test
      DATABASE_URL: sqlite+pysqlite:////app/var/secure.db
    ports:
      - "127.0.0.1:8000:8000"
    tmpfs:
      - /app/var
    networks:
      - larkspur
    depends_on:
      assets:
        condition: service_healthy
      backoffice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/healthz').status_code==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # One-shot verification gate: Ruff, mypy, and pytest inside the container,
  # against healthy fixtures and the live secure service. Invoked with
  # `docker compose run --rm --build verify`.
  verify:
    build: .
    image: fetchjack:dev
    profiles: ["verify"]
    command: ["sh", "-euc", "ruff check . && ruff format --check . && mypy src tests && pytest -q"]
    environment:
      ASSETS_BASE_URL: http://assets.larkspur.test
      INTERNAL_BASE_URL: http://backoffice.larkspur.internal
      SECURE_BASE_URL: http://secure:8000
    depends_on:
      assets:
        condition: service_healthy
      backoffice:
        condition: service_healthy
      secure:
        condition: service_healthy
    networks:
      - larkspur

networks:
  # A user-defined bridge with IP masquerading disabled: containers can reach one
  # another and the host can reach published loopback ports, but no container can
  # reach the public internet (no SNAT, so replies from outside are unroutable).
  # This keeps the loopback publishing required by the apps while guaranteeing the
  # hermetic boundary the demonstration depends on.
  larkspur:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
